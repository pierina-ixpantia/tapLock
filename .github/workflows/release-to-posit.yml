name: Publica paquete R a Posit Package Manager (Ubuntu, Debian y RHEL)

on:
  release:
    types: [published]
  workflow_dispatch:

# Evita ejecuciones simultáneas para el mismo ref (dos publicaciones a la vez
# sobre el mismo paquete pueden chocar en el servidor).
concurrency:
  group: publicar-ppm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGEMANAGER_ADDRESS: "https://pm.ixpantia.org"
  RSPM_SERVER_VERSION: "2026.09.0" # Versión REAL del servidor (consultada via /__api__/status)
  R_VERSION: "4.6.0"
  # Los requisitos de sistema se instalan explícitamente en cada job; se evita
  # que pak intente instalarlos por su cuenta (en RHEL ejecuta
  # `subscription-manager`, que no funciona en contenedores sin suscripción).
  # Se definen ambos nombres porque varía según la versión de pak/pkgdepends.
  R_PKG_SYSREQS: "false"
  PKG_SYSREQS: "false"

jobs:
  # Job 1: construye y publica el paquete FUENTE una única vez.
  # En Posit Package Manager la versión del paquete debe existir en la fuente
  # antes de poder asociar binarios. El tarball se comparte como artifact para
  # que todos los binarios se construyan desde exactamente el mismo fuente.
  publicar-fuente:
    name: Construye & Publica paquete fuente (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Descarga codigo fuente del repositorio
        uses: actions/checkout@v4

      - name: Preparar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Instalación de librerías del sistema base
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            cmake \
            libicu-dev \
            libuv1-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            zlib1g-dev \
            git \
            curl

      # R se instala directamente del CDN de Posit (mismo canal y versión que
      # los binarios) en lugar de r-lib/actions/setup-r.
      - name: Instalar R desde el CDN de Posit (Ubuntu 24.04)
        run: |
          curl -fL --retry 3 -o /tmp/r-install.deb \
            "https://cdn.posit.co/r/ubuntu-2404/pkgs/r-${R_VERSION}_1_amd64.deb"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/r-install.deb
          rm -f /tmp/r-install.deb
          if ! command -v R >/dev/null 2>&1; then
            sudo ln -sf "/opt/R/${R_VERSION}/bin/R" /usr/local/bin/R
            sudo ln -sf "/opt/R/${R_VERSION}/bin/Rscript" /usr/local/bin/Rscript
          fi
          Rscript -e 'cat(R.version.string, "\n")'

      - name: Instalar dependencias de R listadas en DESCRIPTION
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Construir el Paquete Fuente
        run: |
          R CMD build --no-build-vignettes .
          mkdir -p dist
          SRC_TAR=$(ls *.tar.gz | head -n 1)
          mv "$SRC_TAR" dist/
          echo "PKG_SRC=dist/$SRC_TAR" >> "$GITHUB_ENV"
          echo "Paquete fuente generado: dist/$SRC_TAR"

      - name: Guardar el paquete fuente como artifact
        uses: actions/upload-artifact@v4
        with:
          name: paquete-fuente
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Instalar el CLI de rspm y Publicar paquete fuente en Posit Package Manager
        env:
          PACKAGEMANAGER_TOKEN: ${{ secrets.PACKAGEMANAGER_TOKEN }}
        run: |
          # La versión del CLI debe coincidir con la del servidor
          curl -f --retry 3 -o rspm \
            "https://cdn.posit.co/package-manager/linux/amd64/rspm-cli-linux-${RSPM_SERVER_VERSION}"
          chmod +x rspm

          # Probar conectividad con el servidor
          ./rspm verify

          # --succeed-on-existing no cubre el caso "is identical to an existing
          # package" que devuelve el servidor, así que se tolera manualmente.
          # Esto permite re-ejecutar el workflow para agregar binarios de otras
          # distribuciones sin que el job de fuente falle.
          if ! OUT=$(./rspm add --source=github-ix --path="${PKG_SRC}" --succeed-on-existing 2>&1); then
            echo "$OUT"
            if echo "$OUT" | grep -qiE 'already exists|identical to an existing'; then
              echo "::warning::La versión del paquete ya existe en 'github-ix'; se continúa con la publicación de binarios."
              exit 0
            fi
            exit 1
          fi
          echo "$OUT"

  # Job 2: compila y publica el binario precompilado por distribución.
  # Cada entrada corre en un contenedor de la distro objetivo.
  publicar-binarios:
    name: Construye & Publica binario (${{ matrix.label }})
    needs: publicar-fuente
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Ubuntu 24.04 (noble)"
            image: ubuntu:24.04
            pkg_mgr: apt
            posit_os: ubuntu-2404
            distribution: noble
          # Debian 13 (trixie) es la distribución Debian que ofrece el servidor PPM actual.
          - label: "Debian 13 (trixie)"
            image: debian:13
            pkg_mgr: apt
            posit_os: debian-13
            distribution: trixie
          # RHEL 9/10 se construyen sobre Rocky Linux: es binariamente compatible
          # con RHEL, no requiere suscripción y trae los repos CRB/EPEL. Los
          # binarios se publican con la distribución rhel9/rhel10 del servidor.
          - label: "RHEL 9"
            image: rockylinux/rockylinux:9
            pkg_mgr: dnf
            posit_os: rhel-9
            distribution: rhel9
          - label: "RHEL 10"
            image: rockylinux/rockylinux:10
            pkg_mgr: dnf
            posit_os: rhel-10
            distribution: rhel10
    container:
      image: ${{ matrix.image }}
      # Algunas imágenes (Rocky/RHEL) no definen PATH en su configuración y el
      # runner lo pierde cuando un paso modifica GITHUB_PATH ("bash: not found").
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      # En contenedores se ejecuta como root, por eso no se usa sudo
      - name: Instalación de librerías del sistema base (apt - Ubuntu/Debian)
        if: matrix.pkg_mgr == 'apt'
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bash \
            build-essential \
            cmake \
            libicu-dev \
            libuv1-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            zlib1g-dev \
            git \
            curl \
            ca-certificates

      # Se habilitan CRB (libuv-devel y otros -devel) y EPEL (dependencias de R).
      # Sin `curl`: la imagen trae `curl-minimal`, que entra en conflicto con
      # el paquete `curl` completo; el binario /usr/bin/curl ya está disponible.
      # `xz`: rextendr descomprime rust/vendor.tar.xz y la imagen mínima no lo trae.
      - name: Instalación de librerías del sistema base (dnf - RHEL)
        if: matrix.pkg_mgr == 'dnf'
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y \
            bash \
            gcc-c++ \
            make \
            cmake \
            libicu-devel \
            libuv-devel \
            zlib-devel \
            openssl-devel \
            libcurl-devel \
            libxml2-devel \
            git \
            ca-certificates \
            tar \
            gzip \
            xz

      # Git ya está instalado: checkout obtiene un clon real en lugar del tarball.
      - name: Descarga codigo fuente del repositorio
        uses: actions/checkout@v4

      - name: Instalar R desde el CDN de Posit (apt - Ubuntu/Debian)
        if: matrix.pkg_mgr == 'apt'
        run: |
          curl -fsSL --retry 3 -o /tmp/r-install.deb \
            "https://cdn.posit.co/r/${{ matrix.posit_os }}/pkgs/r-${R_VERSION}_1_amd64.deb"
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/r-install.deb
          rm -f /tmp/r-install.deb

      - name: Instalar R desde el CDN de Posit (dnf - RHEL)
        if: matrix.pkg_mgr == 'dnf'
        run: |
          dnf install -y \
            "https://cdn.posit.co/r/${{ matrix.posit_os }}/pkgs/R-${R_VERSION}-1-1.x86_64.rpm"

      # Los builds de R de Posit se instalan en /opt/R/<versión>
      - name: Enlazar R al PATH
        run: |
          if ! command -v R >/dev/null 2>&1; then
            ln -sf "/opt/R/${R_VERSION}/bin/R" /usr/local/bin/R
            ln -sf "/opt/R/${R_VERSION}/bin/Rscript" /usr/local/bin/Rscript
          fi
          Rscript -e 'cat(R.version.string, "\n")'

      # Rust se instala a mano (en lugar de dtolnay/rust-toolchain) porque ese
      # action modifica GITHUB_PATH y rompe el PATH en estos contenedores. Se
      # usan rutas fijas y enlaces en /usr/local/bin, igual que con R.
      - name: Instalar Rust (rustup)
        run: |
          export CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup
          curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          for bin in cargo rustc rustup rustdoc; do
            ln -sf "/opt/cargo/bin/$bin" "/usr/local/bin/$bin"
          done
          echo "CARGO_HOME=/opt/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/rustup" >> "$GITHUB_ENV"
          cargo --version
          rustc --version

      - name: Instalar dependencias de R listadas en DESCRIPTION
        uses: r-lib/actions/setup-r-dependencies@v2

      # Se reutiliza el mismo tarball fuente que se publicó en el job 1
      - name: Descargar el paquete fuente
        uses: actions/download-artifact@v4
        with:
          name: paquete-fuente
          path: dist

      - name: Compilar el Paquete Binario para ${{ matrix.label }}
        run: |
          PKG_SRC=$(ls dist/*.tar.gz | head -n 1)
          echo "Compilando desde: $PKG_SRC"

          mkdir -p /tmp/rlib
          R CMD INSTALL -l /tmp/rlib --build "$PKG_SRC"
          rm -rf /tmp/rlib

          # R CMD INSTALL --build deja el binario en el directorio actual
          BIN_TAR=$(ls *_R_*.tar.gz | head -n 1)
          echo "PKG_BIN=$BIN_TAR" >> "$GITHUB_ENV"
          echo "Paquete binario generado: $BIN_TAR"

      - name: Instalar el CLI de rspm y Publicar el binario en Posit Package Manager
        env:
          PACKAGEMANAGER_TOKEN: ${{ secrets.PACKAGEMANAGER_TOKEN }}
        run: |
          curl -f --retry 3 -o rspm \
            "https://cdn.posit.co/package-manager/linux/amd64/rspm-cli-linux-${RSPM_SERVER_VERSION}"
          chmod +x rspm

          ./rspm verify

          # Si el binario ya existe (en el CLI o en el servidor), se tolera
          # para permitir el backfill de binarios sin cambiar la versión.
          if ! OUT=$(./rspm add binary --source=github-ix --distribution="${{ matrix.distribution }}" --path="${PKG_BIN}" --succeed-on-existing 2>&1); then
            echo "$OUT"
            if echo "$OUT" | grep -qiE 'already exists|identical to an existing'; then
              echo "::warning::El binario para ${{ matrix.distribution }} ya existe; no se vuelve a publicar."
              exit 0
            fi
            exit 1
          fi
          echo "$OUT"
